<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brew ERP - Hors ligne</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: "Space Grotesk", "Sora", "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #1f1f1f, #0b0b0b);
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        max-width: 520px;
        padding: 32px;
        border: 1px solid rgba(251, 191, 36, 0.3);
        background: rgba(15, 23, 42, 0.4);
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: #f59e0b;
        margin-bottom: 12px;
      }
      h1 {
        font-weight: 400;
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        margin: 0 0 16px;
        color: rgba(248, 250, 252, 0.7);
        line-height: 1.5;
      }
      .hint {
        font-size: 12px;
        color: rgba(248, 250, 252, 0.6);
      }
      .action {
        margin-top: 24px;
        display: inline-block;
        padding: 10px 18px;
        border: 1px solid rgba(251, 191, 36, 0.5);
        color: #f59e0b;
        text-decoration: none;
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="eyebrow">Mode hors ligne</div>
      <h1>Connexion indisponible</h1>
      <p>
        Brew ERP est temporairement hors ligne. Vos actions critiques restent en file d attente
        et seront synchronisees automatiquement des que la connexion revient.
      </p>
      <p class="hint">Astuce: gardez cette page ouverte pour retrouver l acces plus vite.</p>
      <a class="action" href="/">Revenir a l accueil</a>
    </div>
  </body>
</html>
